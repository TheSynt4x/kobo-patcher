name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kobo-patcher
          key: firmware-${{ hashFiles('patches.yaml') }}
          restore-keys: firmware-
      - name: Check web/patches matches patches.yaml
        run: |
          make patches
          git diff --exit-code web/patches
      - run: make test
        env:
          REQUIRE_FIRMWARE: "1"

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy the page to the server
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
        run: rsync -rlpt --delete --exclude '.*' web/ "$DEPLOY_TARGET"
